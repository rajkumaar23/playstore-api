services:
  app:
    image: ghcr.io/rajkumaar23/playstore-api:main
    container_name: playstore-api-app
    restart: always
    environment:
      - REDIS_ADDRESS=redis:6379
      - SERVER_PORT=5003
      - METRICS_PORT=5004
      - GIN_MODE=release
      - DEFAULT_GL=US
      - CACHE_TTL=24h
      # If you constrain this container's memory, also set GOMEMLIMIT to a
      # value below that cap. Go does not read cgroup limits, so without it
      # the heap grows past the cap and the kernel OOM-kills the process.
      # - GOMEMLIMIT=224MiB
    ports:
      - "5003:5003"
    depends_on:
      - redis
    networks:
      - playstore-api-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: playstore-api-redis
    restart: always
    # Pure cache holding TTL'd entries: evict the coldest keys under memory
    # pressure rather than expiring hot ones on a timer, and skip RDB/AOF
    # entirely so there is no snapshot fork or write amplification.
    # Set --maxmemory to suit your host; without it allkeys-lru never engages.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - playstore-api-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - playstore-api-network

networks:
  playstore-api-network:
    driver: bridge
